# Optional. The project runs fine without Docker (see README).
services:
  backend:
    build: ./backend
    environment:
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in a .env file next to this compose file}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      APP_ENV: production
    volumes:
      - app_data:/data          # SQLite database + private uploads persist here
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000/api/v1
    depends_on:
      - backend
    ports:
      - "8080:80"
volumes:
  app_data:
